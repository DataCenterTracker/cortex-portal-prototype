<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cortex Client Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{
  --navy:#1C1C3C; --navy-deep:#12122E; --brick:#FCBC04; --brick-soft:#FEF4D0;
  --slate:#566A76; --line:#D5DBE3; --chrome:#EEF1F5; --chrome-2:#E3E8EF;
  --paper:#FFFFFF; --ink:#1A2233; --ink-soft:#3C4659;
  --green:#2E7D5B; --yellow:#C8921A; --red:#B3423A;
  --rail-bg:var(--navy); --rail-fg:#DCE3EF; --rail-fg-dim:#8E9BB5;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --header-h:56px; --rail-w:232px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --chrome:#141B2A; --chrome-2:#1C2436; --line:#2B364C; --slate:#9AA6BC;
    --ink:#E6EAF2; --ink-soft:#C3CBDA; --brick-soft:#3A3010;
    --rail-bg:#0E1626; --paper:#1A2233;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --chrome:#141B2A; --chrome-2:#1C2436; --line:#2B364C; --slate:#9AA6BC;
  --ink:#E6EAF2; --ink-soft:#C3CBDA; --brick-soft:#3A3010;
  --rail-bg:#0E1626; --paper:#1A2233;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--chrome);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
*,*::before,*::after{box-sizing:inherit}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
img{max-width:100%}
:focus-visible{outline:2px solid var(--brick);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:var(--rail-w) 1fr;min-height:100%}
.rail{background:var(--rail-bg);color:var(--rail-fg);padding:22px 18px;display:flex;flex-direction:column;gap:28px;position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));}
.wordmark{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
.wordmark .mark{width:28px;height:28px;border-radius:7px;background:#fff;color:var(--navy);display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:17px}
.wordmark .name{font-family:var(--serif);font-weight:600;font-size:19px;letter-spacing:.01em}
.wordmark .sub{display:block;font-family:var(--sans);font-size:11px;color:var(--rail-fg-dim);font-weight:400;margin-top:-2px}
.client{padding:12px 12px;border:1px solid rgba(255,255,255,.14);border-radius:8px}
.client .lbl{font-size:12px;color:var(--rail-fg-dim)}
.client .nm{font-weight:600;color:#fff;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:12px;color:var(--rail-fg-dim);margin:10px 12px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:7px;text-decoration:none;color:var(--rail-fg);font-size:14px}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a.on{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 3px 0 0 var(--brick)}
.nav a .cad{margin-left:auto;font-size:11px;color:var(--rail-fg-dim)}
.rail .foot{margin-top:auto;font-size:12px;color:var(--rail-fg-dim);display:flex;flex-direction:column;gap:8px}
.rail .foot a{color:var(--rail-fg)}
.rail .foot .who{color:#fff}

.scrim{display:none}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:var(--header-h);background:var(--chrome);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 24px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--chrome)}
.topbar .crumb{display:flex;align-items:center;gap:8px;min-width:0;font-size:14px;color:var(--slate)}
.topbar .crumb a{text-decoration:none;color:var(--slate)}
.topbar .crumb a:hover{color:var(--ink)}
.topbar .crumb strong{color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .spacer{flex:1}
.topbar .btn{margin-left:0}

.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:7px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:13.5px;font-weight:500;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--slate)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--navy-deep)}
.btn.icon{width:34px;padding:0;justify-content:center}
.btn.ghost{background:transparent;border-color:transparent;color:var(--slate)}
.btn.ghost:hover{color:var(--ink);background:var(--chrome-2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;height:34px}
.seg button{border:0;background:var(--paper);padding:0 11px;font-size:13px;color:var(--slate)}
.seg button.on{background:var(--navy);color:#fff}

.content{padding:24px;flex:1}
.content.tight{padding:0}

/* ---------- login ---------- */
.login{min-height:100vh;display:grid;place-items:center;background:var(--rail-bg);padding:24px}
.login .card{width:min(420px,100%);background:var(--paper);border-radius:12px;padding:34px 34px 28px;box-shadow:0 30px 60px rgba(0,0,0,.35)}
.login .card .wordmark{color:var(--ink);margin-bottom:22px}
.login .card .wordmark .mark{background:var(--navy);color:#fff}
.login .card .wordmark .sub{color:var(--slate)}
.login h1{font-family:var(--serif);font-weight:500;font-size:24px;margin:0 0 6px}
.login p{margin:0 0 20px;color:var(--slate);font-size:14px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;color:var(--ink-soft)}
.field input,.field select,.field textarea{height:40px;border:1px solid var(--line);border-radius:7px;padding:0 12px;background:var(--paper);color:var(--ink);font:inherit;font-size:14px}
.field textarea{height:auto;padding:10px 12px}
.field input:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(28,43,74,.15)}
.login .btn.primary{width:100%;height:40px;justify-content:center}
.login .fine{margin-top:18px;font-size:12px;color:var(--slate)}
.login .sent{text-align:center;padding:14px 0 4px}
.login .sent .env{font-size:36px}
.login .sent h2{font-family:var(--serif);font-weight:500;font-size:20px;margin:8px 0 6px}
.login .sent .btn{margin-top:14px}

/* ---------- home ---------- */
.h1{font-family:var(--serif);font-weight:500;font-size:26px;margin:0 0 4px;letter-spacing:-.01em}
.lede{color:var(--slate);margin:0 0 22px}
.pubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.pub{display:block;text-decoration:none;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px 20px 16px;position:relative}
.pub:hover{border-color:var(--slate)}
.pub .mast{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.pub .shield{width:40px;height:46px;border-radius:4px 4px 18px 18px;background:var(--navy);display:grid;place-items:center;color:#fff;font-family:var(--serif);font-size:18px;position:relative;flex:none}
.pub .shield::after{content:"";position:absolute;inset:4px;border:1px solid rgba(255,255,255,.35);border-radius:3px 3px 15px 15px}
.pub .pname{font-family:var(--serif);font-weight:600;font-size:18px;color:var(--ink)}
.pub .psub{font-size:13px;color:var(--slate)}
.pub .latest{border-top:1px solid var(--line);padding-top:12px;display:flex;gap:12px;align-items:flex-start}
.pub .latest .d{font-size:12px;color:var(--slate);flex:none;width:72px;padding-top:2px}
.pub .latest .t{color:var(--ink);font-weight:500}
.pub .latest .s{font-size:13px;color:var(--slate);margin-top:2px}
.pub .cad{position:absolute;top:18px;right:18px;font-size:12px;color:var(--slate);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;vertical-align:middle;margin-right:5px}
.dot.red{background:var(--red)} .dot.yellow{background:var(--yellow)} .dot.green{background:var(--green)}
.note{font-size:13px;color:var(--slate);margin-top:22px}

/* ---------- edition ---------- */
.edition{display:grid;grid-template-columns:minmax(0,3fr) minmax(320px,2fr);height:calc(100vh - var(--header-h) - env(safe-area-inset-top,0px));}
.edition.above{grid-template-columns:1fr;height:auto}
.edition.above .viewer{height:calc(100vh - var(--header-h) - env(safe-area-inset-top,0px))}
.edition.above .panel{position:static;height:auto;border-left:0;border-bottom:1px solid var(--line);max-height:none}
.edition.above .panel .pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.viewer{position:relative;background:var(--chrome-2);overflow-y:auto;overflow-x:auto;padding:22px 22px 60px}
.viewer .pages{margin:0 auto;display:flex;flex-direction:column;gap:14px;align-items:center}
.page{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.08),0 10px 30px rgba(20,30,50,.18);position:relative}
.page canvas{display:block}
.page .num{position:absolute;right:-30px;top:6px;font-size:11px;color:var(--slate)}
.page.loading{display:grid;place-items:center;color:var(--slate);font-size:13px}
.vtools{position:sticky;top:0;z-index:2;display:flex;justify-content:center;margin:-22px -22px 14px;padding:10px 22px;background:linear-gradient(var(--chrome-2) 70%,transparent)}
.vtools .bar{display:inline-flex;align-items:center;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:4px 6px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.vtools .bar .pg{font-size:13px;color:var(--slate);padding:0 8px;min-width:64px;text-align:center}
.vtools .bar button{height:28px;min-width:28px;border:0;background:transparent;border-radius:5px;font-size:13px;color:var(--ink-soft);padding:0 8px}
.vtools .bar button:hover{background:var(--chrome-2)}
.vempty{margin:40px auto;max-width:520px;background:var(--paper);border:1px dashed var(--line);border-radius:10px;padding:28px;text-align:center;color:var(--slate)}
.vempty strong{display:block;color:var(--ink);font-weight:500;margin-bottom:6px}

.panel{border-left:1px solid var(--line);background:var(--chrome);overflow-y:auto;padding:22px 22px 40px}
.panel h2{font-family:var(--serif);font-weight:500;font-size:19px;margin:0 0 2px}
.panel .period{font-size:13px;color:var(--slate);margin-bottom:18px}
.kpi{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
.kpi .n{font-family:var(--serif);font-weight:500;font-size:40px;line-height:1;letter-spacing:-.02em}
.kpi .l{color:var(--slate);font-size:14px}
.kpi .delta{font-size:13px;color:var(--green);margin-left:auto}
.kpi .delta.down{color:var(--brick)}
.widget{margin-top:22px}
.widget .wh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.widget .wh h3{font-size:14px;font-weight:500;margin:0;color:var(--ink-soft)}
.widget .wh button{border:0;background:transparent;font-size:12px;color:var(--slate);padding:2px 4px}
.widget .wh button:hover{color:var(--ink);text-decoration:underline}
.widget svg{width:100%;height:auto;display:block}
.widget table{width:100%;border-collapse:collapse;font-size:13px}
.widget td{padding:5px 0;border-bottom:1px solid var(--line)}
.widget td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.widget .hide{display:none}
.anote{margin-top:22px;padding:14px 16px;background:var(--paper);border:1px solid var(--line);border-radius:8px;font-size:14px;color:var(--ink-soft)}
.anote .by{font-size:12px;color:var(--slate);margin-bottom:6px}
.alertbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#FEF4D0;border:1px solid rgba(252,188,4,.4);border-radius:8px;margin-bottom:18px;font-size:13.5px}
.alertbar b{font-weight:600}
.sections{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.sections button{height:28px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:0 11px;font-size:12.5px;color:var(--ink-soft)}
.sections button:hover{border-color:var(--navy);color:var(--ink)}
.jump{position:relative}
.jump .menu{position:absolute;right:0;top:40px;background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.15);min-width:200px;padding:6px;z-index:9;display:none}
.jump.open .menu{display:block}
.jump .menu button{display:flex;width:100%;justify-content:space-between;border:0;background:transparent;padding:8px 10px;border-radius:6px;font-size:13.5px;text-align:left}
.jump .menu button:hover{background:var(--chrome-2)}
.jump .menu button span{color:var(--slate);font-size:12px}

/* ---------- archive ---------- */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:22px}
.filters input{height:36px;border:1px solid var(--line);border-radius:7px;padding:0 12px;background:var(--paper);color:var(--ink);font:inherit;font-size:14px;min-width:240px;flex:1}
.filters .chip{height:32px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:0 12px;font-size:13px;color:var(--ink-soft)}
.filters .chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.month{margin-bottom:28px}
.month h3{font-family:var(--serif);font-weight:500;font-size:17px;margin:0 0 10px;color:var(--ink)}
.rows{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:96px 1fr auto;gap:16px;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.row:last-child{border-bottom:0}
.row:hover{background:var(--chrome)}
.row .d{font-size:13px;color:var(--slate)}
.row .d b{display:block;font-weight:500;color:var(--ink);font-size:14px}
.row .t{font-weight:500}
.row .s{font-size:13px;color:var(--slate);margin-top:2px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.row .m{font-size:12.5px;color:var(--slate);text-align:right;white-space:nowrap}
.row .m b{display:block;color:var(--ink);font-weight:500;font-size:14px;font-variant-numeric:tabular-nums}
.empty{padding:40px;text-align:center;color:var(--slate)}

/* ---------- trends ---------- */
.tgrid{display:grid;grid-template-columns:2fr 1fr;gap:18px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.card h3{font-size:14px;font-weight:500;margin:0 0 12px;color:var(--ink-soft)}
.card svg{width:100%;height:auto;display:block}
.span-2{grid-column:1/-1}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:500;color:var(--slate);font-size:12.5px;padding:8px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:10px 0;border-bottom:1px solid var(--line)}
.tbl td:last-child,.tbl th:last-child{text-align:right;font-variant-numeric:tabular-nums}
.tbl a{text-decoration:none;color:var(--ink);font-weight:500}
.tbl a:hover{text-decoration:underline}

/* ---------- admin ---------- */
.agrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:34px 20px;text-align:center;background:var(--paper);color:var(--slate)}
.drop strong{display:block;color:var(--ink);font-weight:500;font-size:16px;margin-bottom:4px}
.drop .btn{margin-top:14px}
.drop.done{border-style:solid;border-color:var(--green)}
.form .field{margin-bottom:12px}
.form .two{display:grid;grid-template-columns:1f 1fr;grid-template-columns:1fr 1fr;gap:12px}
.form .hint{font-size:12px;color:var(--slate)}
.form .found{font-size:12px;color:var(--green)}
.actions{display:flex;gap:10px;margin-top:8px}
.wlist{display:flex;flex-direction:column;gap:8px}
.witem{display:flex;align-items:center;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.witem .grab{color:var(--line);font-size:18px;cursor:grab}
.witem .wt{flex:1}
.witem .wt b{font-weight:500;display:block}
.witem .wt span{font-size:12.5px;color:var(--slate)}
.toggle{width:40px;height:22px;border-radius:999px;background:var(--line);border:0;position:relative;flex:none}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.toggle.on{background:var(--green)}
.toggle.on::after{transform:translateX(18px)}
.stat{display:flex;gap:18px;margin-bottom:18px}
.stat .card{flex:1}
.stat .card .n{font-family:var(--serif);font-size:30px;font-weight:500;line-height:1.1}
.stat .card .l{font-size:13px;color:var(--slate)}
.adm-tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.adm-tabs a{text-decoration:none;color:var(--slate);padding:8px 12px;font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px}
.adm-tabs a.on{color:var(--ink);border-color:var(--brick)}
.proto{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--slate);border:1px solid var(--line);border-radius:999px;padding:3px 10px;margin-left:8px}
.proto::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--yellow)}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--navy-deep);color:#fff;padding:10px 16px;border-radius:8px;font-size:13.5px;opacity:0;pointer-events:none;transition:all .2s;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.panel.collapsed{padding-bottom:12px}
.panel .ptoggle{display:none;align-items:center;justify-content:space-between;width:100%;border:0;background:transparent;padding:0 0 8px;font-size:14px;font-weight:500;color:var(--ink)}
.panel .ptoggle span{color:var(--slate);font-size:12px;font-weight:400}

/* ---------- responsive ---------- */
.menu-btn{display:none}
@media (max-width:1023px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;left:0;top:0;bottom:0;width:min(280px,85vw);z-index:20;transform:translateX(-100%);transition:transform .2s;height:100vh;padding-top:calc(22px + env(safe-area-inset-top,0px))}
  .rail.open{transform:none}
  .scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:19}
  .menu-btn{display:inline-flex}
  .edition{grid-template-columns:1fr;height:auto}
  .panel{border-left:0;border-bottom:1px solid var(--line);max-height:none;order:-1}
  .panel.collapsed .pbody{display:none}
  .panel .ptoggle{display:flex}
  .viewer{height:calc(100vh - var(--header-h) - env(safe-area-inset-top,0px));padding:14px 10px 60px}
  .page .num{display:none}
  .vtools{margin:-14px -10px 10px;padding:8px 10px}
  .tgrid,.agrid{grid-template-columns:1fr}
  .row{grid-template-columns:72px 1fr}
  .row .m{display:none}
  .content{padding:16px}
  .topbar{padding:0 12px}
  .topbar .hide-m{display:none}
  .topbar .crumb span{white-space:nowrap}
  .topbar .btn .lbl-l{display:none}
}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ===================== DATA (prototype) ===================== */
const PDF_URL = "assets/newsletters/data-centers-work-2026-10-22.pdf";

const CLIENT = { name:"Data Centers Work", contact:"AJ Reichelt, Cortex" };

const PUBS = {
  "dcw-daily": {
    id:"dcw-daily", name:"Data Centers Work", sub:"Pulse by Cortex: Daily Brief", cadence:"Daily", letter:"D",
    desc:"Insights, analysis, and the state of play of the data center debate in Alabama and Georgia.",
    alerts:true
  },

/* ===================== SVG CHARTS ===================== */
function lineChart(data){
  const W=420,H=160,pl=36,pr=22,pt=12,pb=26;
  const max=Math.max(...data.map(d=>d[1]))*1.1;
  const x=i=>pl+(W-pl-pr)*i/(data.length-1);
  const y=v=>pt+(H-pt-pb)*(1-v/max);
  const pts=data.map((d,i)=>`${x(i)},${y(d[1])}`).join(" ");
  const area=`M${x(0)},${H-pb} L${pts.split(" ").join(" L")} L${x(data.length-1)},${H-pb} Z`;
  const ticks=[0,.5,1].map(f=>{const v=Math.round(max*f/100)*100;return `<g><line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--slate)">${fmt(v)}</text></g>`}).join("");
  const labels=data.map((d,i)=>`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--slate)">${d[0]}</text>`).join("");
  const dots=data.map((d,i)=>`<circle cx="${x(i)}" cy="${y(d[1])}" r="3" fill="var(--navy)" stroke="var(--paper)" stroke-width="1.5"><title>${d[0]}: ${fmt(d[1])}</title></circle>`).join("");
  const peak=data.reduce((a,d,i)=>d[1]>data[a][1]?i:a,0);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily mentions">
    ${ticks}
    <path d="${area}" fill="var(--navy)" opacity=".08"/>
    <polyline points="${pts}" fill="none" stroke="var(--navy)" stroke-width="2" stroke-linejoin="round"/>
    ${dots}
    <text x="${x(peak)}" y="${y(data[peak][1])-9}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink)">${fmt(data[peak][1])}</text>
    ${labels}
  </svg>`;
}
function barChart(data,accentIdx=-1){
  const W=420,rowH=22,pl=96,H=data.length*rowH+4;
  const max=Math.max(...data.map(d=>d[1]));
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Breakdown">${data.map((d,i)=>{
    const w=(W-pl-52)*d[1]/max, y=i*rowH+2;
    return `<g><text x="${pl-8}" y="${y+14}" text-anchor="end" font-size="12" fill="var(--ink-soft)">${esc(d[0])}</text>
      <rect x="${pl}" y="${y+3}" width="${w}" height="${rowH-8}" rx="2" fill="${i===accentIdx?"var(--brick)":"var(--navy)"}" opacity="${i===accentIdx?1:0.9-i*0.07}"><title>${esc(d[0])}: ${fmt(d[1])}</title></rect>
      <text x="${pl+w+6}" y="${y+14}" font-size="11" fill="var(--slate)">${fmt(d[1])}</text></g>`}).join("")}</svg>`;
}
function tableOf(data){ return `<table>${data.map(d=>`<tr><td>${esc(d[0])}</td><td>${fmt(d[1])}</td></tr>`).join("")}</table>`; }
function widget(title,svg,data){
  const id="w"+Math.random().toString(36).slice(2,7);
  return `<div class="widget" data-w="${id}"><div class="wh"><h3>${title}</h3><button data-toggle="${id}">Show as table</button></div><div class="chart">${svg}</div><div class="tbl hide">${tableOf(data)}</div></div>`;
}

      <div class="wlist">${ws.map(w=>`<div class="witem"><span class="grab">⋮⋮</span><div class="wt"><b>${w[0]}</b><span>${w[1]}</span></div><button class="btn ghost" data-proto>Edit</button><button class="toggle ${w[2]?"on":""}" data-tog aria-label="Toggle"></button></div>`).join("")}</div>
      <div class="actions" style="margin-top:14px"><button class="btn" data-proto>Add a chart</button><button class="btn ghost" data-proto>Reset to defaults</button></div>`;
  } else if(tab==="clients"){
    body=`<div class="stat"><div class="card"><div class="n">2</div><div class="l">Clients</div></div><div class="card"><div class="n">4</div><div class="l">Publications</div></div><div class="card"><div class="n">11</div><div class="l">Client users</div></div></div>
      <table class="tbl"><tr><th>Client</th><th>Publications</th><th>Allowed email domains</th><th>Alerts</th><th>Users</th></tr>
      <tr><td><a href="#admin/clients">Data Centers Work</a></td><td>Daily Brief, Weekly Pulse</td><td>fulcrumintel.com</td><td>Daily on · Weekly off</td><td>3</td></tr>
      <tr><td><a href="#admin/clients">Ballad Health</a></td><td>Daily, Weekly</td><td>balladhealth.org</td><td>Off</td><td>8</td></tr></table>
      <div class="actions" style="margin-top:16px"><button class="btn primary" data-proto>Add a client</button><button class="btn" data-proto>Invite a user</button></div>`;
  } else {
    const log=[["Oct 27, 8:02 AM","Jordan Hale","Data Centers Work","Daily Brief for 10/23","Viewed"],["Oct 27, 8:04 AM","Jordan Hale","Data Centers Work","Daily Brief for 10/23","Downloaded PDF"],["Oct 26, 5:41 PM","M. Alvarez","Ballad Health","Week of Oct 19","Viewed"],["Oct 26, 9:15 AM","Jordan Hale","Data Centers Work","Daily Brief for 10/22","Viewed"],["Oct 23, 11:20 AM","J. Patel","Ballad Health","Daily for 10/23","Viewed"]];
    body=`<p class="lede">Every view and download, by user. Exportable for a client on request.</p><table class="tbl"><tr><th>When</th><th>User</th><th>Client</th><th>Edition</th><th>Action</th></tr>${log.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table><div class="actions" style="margin-top:14px"><button class="btn" data-proto>Export CSV</button></div>`;
  }
  const html=shell("admin",`<div class="crumb"><strong>Cortex staff</strong><span class="proto">Prototype</span></div><div class="spacer"></div><a class="btn" href="#home">Back to client view</a>`,`<h1 class="h1">Cortex staff</h1>${tabs}${body}`);
  return html.replace('<div class="client"><div class="lbl">Signed in to</div><div class="nm">Data Centers Work</div></div>','<div class="client"><div class="lbl">Signed in as</div><div class="nm">AJ Reichelt · Cortex</div></div>');
}

/* ===================== PDF VIEWER ===================== */
let pdfDoc=null, scale=null, pageEls=[], renderedScale={}; let archQ="", archFilt="all";
async function mountPdf(){
  const pages=$("#pages"); if(!pages) return;
  const viewer=$("#viewer");
  if(!window.pdfjsLib){ pages.innerHTML=`<iframe src="${PDF_URL}" style="width:100%;height:calc(100vh - 140px);border:0;border-radius:4px;background:#fff"></iframe>`; return; }
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  try{ pdfDoc=await pdfjsLib.getDocument(PDF_URL).promise; }
  catch(e){ pages.innerHTML=`<div class="vempty"><strong>Couldn’t load the PDF</strong>${esc(e.message||e)}</div>`; return; }
  $("#pg").textContent=`1 / ${pdfDoc.numPages}`;
  const first=await pdfDoc.getPage(1);
  const base=first.getViewport({scale:1});
  const fit=()=>Math.min((viewer.clientWidth-44)/base.width, 1.6);
  scale=fit();
  pageEls=[]; pages.innerHTML="";
  for(let i=1;i<=pdfDoc.numPages;i++){
    const el=document.createElement("div"); el.className="page loading"; el.dataset.page=i;
    el.style.width=Math.floor(base.width*scale)+"px"; el.style.height=Math.floor(base.height*scale)+"px";
    el.innerHTML=`<span>Page ${i}</span><span class="num">${i}</span>`;
    pages.appendChild(el); pageEls.push(el);
  }
  const io=new IntersectionObserver(entries=>{entries.forEach(en=>{ if(en.isIntersecting) renderPage(+en.target.dataset.page); })},{root:viewer,rootMargin:"600px 0px"});
  pageEls.forEach(el=>io.observe(el));
  viewer.addEventListener("scroll",()=>{ // page indicator
    let best=1,bd=1e9; pageEls.forEach(el=>{const d=Math.abs(el.getBoundingClientRect().top-viewer.getBoundingClientRect().top-40); if(d<bd){bd=d;best=+el.dataset.page}});
    $("#pg").textContent=`${best} / ${pdfDoc.numPages}`;
  },{passive:true});
  viewer.querySelectorAll("[data-zoom]").forEach(b=>b.addEventListener("click",()=>{
    const z=b.dataset.zoom; scale=z==="fit"?fit():z==="+"?Math.min(scale*1.2,3):Math.max(scale/1.2,.4); rezoom(base);
  }));
  let rt; window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{ if(Math.abs(scale-fit())<.01||scale>fit()){scale=fit();rezoom(base)} },150)});
}
function rezoom(base){
  renderedScale={};
  pageEls.forEach(el=>{ el.style.width=Math.floor(base.width*scale)+"px"; el.style.height=Math.floor(base.height*scale)+"px"; const c=el.querySelector("canvas"); if(c) c.remove(); el.classList.add("loading"); });
  const viewer=$("#viewer"); const top=viewer.getBoundingClientRect().top;
  pageEls.forEach(el=>{ const r=el.getBoundingClientRect(); if(r.bottom>top-600&&r.top<top+viewer.clientHeight+600) renderPage(+el.dataset.page); });
}
async function renderPage(n){
  if(!pdfDoc||renderedScale[n]===scale) return; renderedScale[n]=scale;
  const el=pageEls[n-1]; const page=await pdfDoc.getPage(n);
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const vp=page.getViewport({scale:scale*dpr});
  const canvas=document.createElement("canvas"); canvas.width=vp.width; canvas.height=vp.height;
  canvas.style.width=Math.floor(vp.width/dpr)+"px"; canvas.style.height=Math.floor(vp.height/dpr)+"px";
  await page.render({canvasContext:canvas.getContext("2d"),viewport:vp}).promise;
  if(renderedScale[n]!==scale) return;
  const old=el.querySelector("canvas"); if(old) old.remove();
  el.classList.remove("loading"); el.querySelector("span:not(.num)")?.remove(); el.prepend(canvas);
}
function goPage(n){ const el=pageEls[n-1]; if(!el){toast("Open the Oct 22 sample to jump between sections.");return;} const v=$("#viewer"); v.scrollTo({top:el.offsetTop-v.offsetTop-10,behavior:"smooth"}); }

/* ===================== ROUTER ===================== */
function route(){
  const h=(location.hash||"#login").slice(1); const [v,a,b]=h.split("/");
  const root=$("#root"); window.scrollTo(0,0);
  if(v==="login"||v===""){ root.innerHTML=viewLogin(); $("#sendLink").onclick=()=>loginSent($("#em").value); $("#em").addEventListener("keydown",e=>{if(e.key==="Enter")loginSent($("#em").value)}); return; }
  if(v==="home") root.innerHTML=viewHome();
  else if(v==="edition"&&PUBS[a]) root.innerHTML=viewEdition(a,b);
  else if(v==="archive") root.innerHTML=viewArchive(PUBS[a]?a:"dcw-daily",archQ,archFilt);
  else if(v==="trends") root.innerHTML=viewTrends(PUBS[a]?a:"dcw-daily");
  else if(v==="admin") root.innerHTML=viewAdmin(a||"upload");
  else { location.hash="#home"; return; }
  wire(v,a);
}
function wire(v,pubId){
  const rail=$("#rail"),scrim=$("#scrim"),mb=$("#menuBtn");
  if(mb){ mb.onclick=()=>{rail.classList.add("open");scrim.classList.add("show")}; scrim.onclick=()=>{rail.classList.remove("open");scrim.classList.remove("show")}; rail.querySelectorAll("a").forEach(a=>a.addEventListener("click",()=>{rail.classList.remove("open");scrim.classList.remove("show")})); }
  document.querySelectorAll("[data-proto]").forEach(el=>el.addEventListener("click",proto));
  document.querySelectorAll("[data-tog]").forEach(el=>el.addEventListener("click",()=>{el.classList.toggle("on");toast(el.classList.contains("on")?"Chart turned on (prototype)":"Chart turned off (prototype)")}));
  document.querySelectorAll("[data-toggle]").forEach(b=>b.addEventListener("click",()=>{const w=b.closest(".widget");const t=w.querySelector(".tbl").classList.toggle("hide");w.querySelector(".chart").classList.toggle("hide",!t);b.textContent=t?"Show as table":"Show as chart"}));
  if(v==="edition"){
    mountPdf();
    document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>{goPage(+b.dataset.page);$("#jump")?.classList.remove("open")}));
    const j=$("#jump"); if(j){ $("#jumpBtn").onclick=e=>{e.stopPropagation();j.classList.toggle("open")}; document.addEventListener("click",()=>j.classList.remove("open"),{once:true}); }
    document.querySelectorAll("[data-layout]").forEach(b=>b.addEventListener("click",()=>{try{localStorage.setItem("layout",b.dataset.layout)}catch(e){} $("#edition").className="edition "+b.dataset.layout; document.querySelectorAll("[data-layout]").forEach(x=>x.classList.toggle("on",x===b));window.dispatchEvent(new Event("resize")); }));
    const pt=$("#ptoggle"); if(pt) pt.onclick=()=>{const p=$("#panel");p.classList.toggle("collapsed");pt.querySelector("span").textContent=p.classList.contains("collapsed")?"Show":"Hide"};
    document.querySelectorAll('a[disabled]').forEach(a=>a.addEventListener("click",e=>e.preventDefault()));
    document.onkeydown=e=>{ if(e.target.tagName==="INPUT")return; if(e.key==="ArrowLeft"){const a=document.querySelector('a[title="Previous edition"]:not([disabled])');a&&a.click()} if(e.key==="ArrowRight"){const a=document.querySelector('a[title="Next edition"]:not([disabled])');a&&a.click()} };
  } else document.onkeydown=null;
  if(v==="archive"){
    const pid=pubId||"dcw-daily";
    const q=$("#q");
    q.addEventListener("input",()=>{ archQ=q.value; const pos=q.selectionStart; $("#root").innerHTML=viewArchive(pid,archQ,archFilt); wire("archive",pid); const nq=$("#q"); nq.focus(); nq.setSelectionRange(pos,pos); });
    document.querySelectorAll("[data-filt]").forEach(b=>b.addEventListener("click",()=>{ archFilt=b.dataset.filt; $("#root").innerHTML=viewArchive(pid,archQ,archFilt); wire("archive",pid); }));
    document.querySelectorAll("[data-pub]").forEach(b=>b.addEventListener("click",()=>{ archQ=""; archFilt="all"; location.hash="#archive/"+b.dataset.pub; }));
  }
}
window.addEventListener("hashchange",route);
route();
</script>
